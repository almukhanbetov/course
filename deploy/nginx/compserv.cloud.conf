# Stage 28A4 — final config, HTTP redirects to HTTPS, HTTPS serves.
#
# Install this AFTER a certificate already exists at the paths referenced
# below (obtained using compserv.cloud.pre-cert.conf — see
# STAGE28_PROGRESS.md's Stage 28A4 section for the exact command sequence).
# Installing this before the certificate exists will fail `nginx -t`
# (cannot load certificate) — that's intentional, not a bug: it's the
# signal that the cert step hasn't happened yet.
#
# Runs on the HOST (not in Docker, per instruction). Proxies to
# 127.0.0.1:8080 (backend) and 127.0.0.1:3001 (frontend) only — both now
# bound to localhost-only in docker-compose.prod.yml, so this Nginx
# process is the sole public entry point to either. PostgreSQL and MinIO
# are never referenced here and have no public port at all (see
# docker-compose.prod.yml's own `ports: !reset []` for both).
server {
    listen 80;
    listen [::]:80;
    server_name compserv.cloud www.compserv.cloud;

    # Kept alive over plain HTTP even after HTTPS is enforced below, so
    # certbot's unattended renewal (via the same HTTP-01 challenge type)
    # keeps working indefinitely without any config change.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name compserv.cloud www.compserv.cloud;

    ssl_certificate     /etc/letsencrypt/live/compserv.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compserv.cloud/privkey.pem;
    # Explicit, self-contained TLS settings (Mozilla "intermediate"
    # baseline) rather than `include /etc/letsencrypt/options-ssl-nginx.conf`
    # — that file is generated by certbot's nginx *plugin* specifically,
    # which this design deliberately doesn't use (see STAGE28_PROGRESS.md
    # for why: `certbot certonly --webroot` only obtains the certificate
    # and never auto-edits this file, keeping the whole config reviewable
    # in one place rather than split across a plugin-managed include).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Order matters for readability only, not correctness — Nginx selects
    # the longest matching prefix location regardless of file order, so
    # /api/ always wins over / for any /api/... request either way.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
