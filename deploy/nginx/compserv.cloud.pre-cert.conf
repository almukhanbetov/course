# Stage 28A4 — bootstrap config, HTTP only.
#
# Install this FIRST, before requesting a certificate — certbot's HTTP-01
# challenge needs port 80 already serving /.well-known/acme-challenge/ for
# this domain, which can't happen until some config exists. Once a real
# certificate has been obtained (see the exact command sequence in
# STAGE28_PROGRESS.md's Stage 28A4 section), replace this file's content
# with compserv.cloud.conf (the final HTTP->HTTPS + HTTPS-serving version)
# and reload — this file is a deliberately temporary stepping stone, not a
# permanent state.
#
# Runs on the HOST (not in Docker, per instruction) — proxies straight to
# the two application containers' host-published ports.
server {
    listen 80;
    listen [::]:80;
    server_name compserv.cloud www.compserv.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
